<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeviceDNA Attacker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100vh;
            overflow-y: auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #1e293b;
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 20px 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .btn:active {
            transform: scale(0.97);
            background-color: #334155;
        }
        .btn-desc {
            font-size: 12px;
            color: #94a3b8;
            font-weight: normal;
        }
        .btn.attack {
            border-left: 4px solid #ef4444;
        }
        .btn.stop {
            background-color: #ef4444;
            color: white;
            border: none;
            text-align: center;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            margin-top: 20px;
            padding: 25px;
        }
        #status {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success {
            background-color: #166534;
            color: #4ade80;
        }
        .error {
            background-color: #7f1d1d;
            color: #fca5a5;
        }
    </style>
</head>
<body>

    <h1>DeviceDNA Attacker</h1>
    <p class="subtitle">Mobile Trigger Interface</p>

    <div id="status">Ready. Select an attack to deploy.</div>

    <button class="btn attack" onclick="triggerAttack(1)">
        🚀 1. Stealth Recon Scan
        <span class="btn-desc">Port-scanning cameras & sensors.</span>
    </button>

    <button class="btn attack" onclick="triggerAttack(2)">
        🦠 2. Botnet C2 + DDoS
        <span class="btn-desc">C2 beaconing followed by massive DDoS flood.</span>
    </button>

    <button class="btn attack" onclick="triggerAttack(3)">
        🕸️ 3. Lateral Movement
        <span class="btn-desc">Worm spread targeting internal SSH/RDP.</span>
    </button>

    <button class="btn attack" onclick="triggerAttack(4)">
        📦 4. Data Exfiltration
        <span class="btn-desc">Massive outbound HTTPS data dump.</span>
    </button>

    <button class="btn stop" onclick="stopAttack()">
        🛑 STOP ALL ATTACKS
    </button>

    <script>
        // Use the laptop's IP address
        const API_BASE = "http://192.168.1.115:8000/api/attack";
        const statusEl = document.getElementById("status");

        function showStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.className = isError ? "error" : "success";
            setTimeout(() => {
                statusEl.textContent = "Ready. Select an attack to deploy.";
                statusEl.className = "";
            }, 4000);
        }

        async function triggerAttack(id) {
            statusEl.textContent = "Deploying attack...";
            statusEl.className = "";
            try {
                const response = await fetch(`${API_BASE}/trigger`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ attack_id: id, duration: 300 })
                });
                
                const data = await response.json();
                if (response.ok) {
                    showStatus(`✅ Attack ${id} deployed successfully!`);
                } else {
                    showStatus(`❌ Failed: ${data.detail || "Unknown error"}`, true);
                }
            } catch (err) {
                showStatus(`❌ Error connecting to backend! Make sure laptop API is running on 192.168.1.115`, true);
            }
        }

        async function stopAttack() {
            statusEl.textContent = "Stopping attacks...";
            statusEl.className = "";
            try {
                const response = await fetch(`${API_BASE}/stop`, { method: 'POST' });
                if (response.ok) {
                    showStatus("🛑 All attacks stopped!");
                } else {
                    showStatus("❌ Failed to stop attacks.", true);
                }
            } catch (err) {
                showStatus(`❌ Error connecting to backend!`, true);
            }
        }
    </script>
</body>
</html>
