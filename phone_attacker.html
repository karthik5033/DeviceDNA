<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeviceDNA Attacker</title>
    <style>
        body { 
            font-family: monospace; 
            text-align: center; 
            background: #040814; 
            color: white; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
        }
        h1 {
            color: #ef4444;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }
        .btn { 
            padding: 25px 50px; 
            font-size: 24px; 
            font-weight: bold; 
            margin: 15px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 90%;
            max-width: 400px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }
        .btn-launch { 
            background-color: #ef4444; 
            color: white; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }
        .btn-stop { 
            background-color: #374151; 
            color: white; 
        }
        .stats { 
            margin-top: 40px; 
            font-size: 20px; 
            width: 90%;
            max-width: 400px;
        }
        .stat-box { 
            background: rgba(255,255,255,0.05); 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
        }
        .stat-value {
            color: #3edcff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>ATTACK SIMULATOR</h1>
    
    <button id="launchBtn" class="btn btn-launch" onclick="startTraffic()">LAUNCH ATTACK</button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopTraffic()" disabled>STOP</button>

    <div class="stats">
        <div class="stat-box">
            <span>TOTAL REQS:</span>
            <span id="totalReqs" class="stat-value">0</span>
        </div>
        <div class="stat-box">
            <span>REQS / SEC:</span>
            <span id="reqsPerSec" class="stat-value">0</span>
        </div>
    </div>

    <div id="errorLog" style="color: red; margin-top: 20px; font-weight: bold; max-width: 400px; word-wrap: break-word;"></div>

    <script>
        // Auto-detect server IP from the current page URL so this works from any device on the network.
        // If opened as a local file (file://), fall back to localhost.
        const PORT = "8000";
        const SERVER_IP = window.location.protocol === 'file:' ? 'localhost' : window.location.hostname;
        const BASE_URL = `http://${SERVER_IP}:${PORT}`;

        let attackInterval;
        let rpsInterval;
        let totalRequests = 0;
        let requestsThisSecond = 0;
        let isRunning = false;

        function sendRequest() {
            if (!isRunning) return;
            try {
                // Just visual spam for the UI to show activity
                fetch(`${BASE_URL}/api/health`, { mode: 'no-cors', cache: 'no-store' }).catch(e => {});
                totalRequests += 2;
                requestsThisSecond += 2;
                document.getElementById('totalReqs').innerText = totalRequests;
            } catch (err) {
                // Ignore visual errors
            }
        }

        async function startTraffic() {
            try {
                if (isRunning) return;
                
                document.getElementById('errorLog').innerText = ""; // Clear errors
                document.getElementById('launchBtn').disabled = true;
                document.getElementById('launchBtn').innerText = "ATTACKING...";
                document.getElementById('stopBtn').disabled = false;
                
                // ACTUAL ATTACK TRIGGER: Tell the backend to infect the IoT nodes
                try {
                    await fetch(`${BASE_URL}/api/attack/trigger`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ attack_id: 2, duration: 300 }) // Stage 2 Botnet/DDoS attack
                    });
                } catch(e) {
                    document.getElementById('errorLog').innerText = "Trigger Error: " + e.message;
                }

                isRunning = true;
                totalRequests = 0;
                requestsThisSecond = 0;
                document.getElementById('totalReqs').innerText = "0";
                document.getElementById('reqsPerSec').innerText = "0";
                
                // Fire a burst every 50ms (non-blocking) for UI effect
                attackInterval = setInterval(sendRequest, 50);
                
                rpsInterval = setInterval(() => {
                    document.getElementById('reqsPerSec').innerText = requestsThisSecond;
                    requestsThisSecond = 0;
                }, 1000);
            } catch (err) {
                document.getElementById('errorLog').innerText = "Start Error: " + err.message;
            }
        }

        async function stopTraffic() {
            try {
                if (!isRunning) return;
                isRunning = false;
                
                // ACTUAL ATTACK STOP: Tell the backend to stop infecting nodes
                try {
                    await fetch(`${BASE_URL}/api/attack/stop`, {
                        method: 'POST'
                    });
                } catch(e) {
                    console.error("Stop Error:", e);
                }

                clearInterval(attackInterval);
                clearInterval(rpsInterval);
                
                document.getElementById('launchBtn').disabled = false;
                document.getElementById('launchBtn').innerText = "LAUNCH ATTACK";
                document.getElementById('stopBtn').disabled = true;
                
                document.getElementById('reqsPerSec').innerText = "0";
            } catch (err) {
                document.getElementById('errorLog').innerText = "Stop Error: " + err.message;
            }
        }
    </script>
</body>
</html>
